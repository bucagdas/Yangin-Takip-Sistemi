name: Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'turkey_border.geojson'
      - '.github/workflows/**'

jobs:
  unit_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'  # ubuntu-latest (26.04) imajında 3.9 yok

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: python -m py_compile main.py update_readme.py
